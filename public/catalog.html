<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSC441 team project - Catalog">
  <title>Catalog | Project Name</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Shared header: keep identical on every page -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Project Name</a>
      <button id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="mainNav">Menu</button>
      <nav id="mainNav" class="main-nav" aria-label="Main">
        <ul>
        <li><a href="index.html">Home</a></li>

      <h1>Catalog</h1>
      <p>Items will load from MySQL later. For now, JavaScript builds this list from sample data.</p>
